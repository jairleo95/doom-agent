agent:
  obs_shape:
  - 64
  - 64
  - 3
  action_dim: 12
  batch_size: 2
  batch_length: 4
  train_every: 5
  train_steps: 1
  prefill_steps: 10
  expl_until: 0
  expl_behavior: greedy
  precision: 16
  compile: false
  grayscale: false
  device: ${device}
