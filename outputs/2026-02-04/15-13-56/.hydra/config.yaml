      timesteps: 5
      doom_skill: 2
      living_reward: -0.005
      frame_skip: 4
      health_penalty: 0.05
      ammo_penalty: 0.01
    - name: skill4_target
      timesteps: 1000000
      doom_skill: 4
      living_reward: 0.0
      frame_skip: 4
      health_penalty: 0.1
      ammo_penalty: 0.05
device: cpu
seed: 0
resume: null
start_stage: 0
video_freq: 50000
visualize: false
wandb:
  enabled: true
  project: doom-agent
  entity: jairleo95
  group: dreamer-v3
