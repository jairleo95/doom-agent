# DreamerV3 Hyperparameters
obs_shape: [64, 64, 3]
action_dim: 12 # Default for deathmatch
batch_size: 16
batch_length: 50
train_every: 1
train_steps: 1
prefill_steps: 1000
expl_until: 0
expl_behavior: greedy
precision: 16
compile: false
grayscale: false # Use RGB if false
device: ${device}
n_envs: 1

# Escalado de Arquitectura (Opcional, sobreescrito por hardware)
dyn_deter: 512
dyn_hidden: 512
units: 512
imag_horizon: 15
# Behavior Cloning (Optional)
pretrain_bc: false
pretrain_bc_path: data/expert_replays
pretrain_steps: 0

# Augmentations & Logic
symmetry: true
reward_shaping: true
