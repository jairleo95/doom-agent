# Lines starting with # are treated as comments (or with whitespaces+#).
# It doesn't matter if you use capital letters or not.
# It doesn't matter if you use underscore or camel notation for keys, e.g. episode_timeout is the same as episodeTimeout.

doom_scenario_path = deathmatch.wad

# Rewards
death_penalty = 1

# Rendering options
screen_resolution = RES_320X240
screen_format = RGB24
render_hud = true
render_crosshair = true
render_weapon = true
render_decals = false
render_particles = false
window_visible = true

# make episodes start after 10 tics (after unholstering the gun)
episode_start_time = 14

# make episodes finish after 4200 actions (tics)
episode_timeout = 4200

# Available buttons
available_buttons = 
	{ 
		MOVE_LEFT 
		MOVE_RIGHT 
		ATTACK 
		MOVE_FORWARD 
		MOVE_BACKWARD 
		TURN_LEFT 
		TURN_RIGHT 
	}

# Game variables that will be in the state
# Index 0: KILLCOUNT/FRAGCOUNT, Index 1: AMMO2, Index 2: HEALTH
available_game_variables = { KILLCOUNT AMMO2 HEALTH }

mode = PLAYER
doom_skill = 5
